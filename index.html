<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Master - Wani Huzaif</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 2px;
        }
        .author {
            text-align: center;
            color: #8e44ad;
            font-weight: bold;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button.add-btn {
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button.add-btn:hover {
            background-color: #219150;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #34495e;
            color: white;
        }
        .given { color: #e74c3c; font-weight: bold; }
        .taken { color: #27ae60; font-weight: bold; }
        .delete-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
        }
        footer {
            margin-top: 25px;
            text-align: center;
            font-size: 12px;
            color: #95a5a6;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Credit Master</h1>
    <p class="author">Created by Wani Huzaif</p>
    <p class="subtitle">Credit & Ledger Manager</p>

    <div class="form-group">
        <label for="name">Person Name:</label>
        <input type="text" id="name" placeholder="Enter name">
    </div>

    <div class="form-group">
        <label for="amount">Amount:</label>
        <input type="number" id="amount" placeholder="Enter amount">
    </div>

    <div class="form-group">
        <label for="type">Transaction Type:</label>
        <select id="type">
            <option value="given">I Gave (You owe me)</option>
            <option value="taken">I Took (I owe you)</option>
        </select>
    </div>

    <button class="add-btn" onclick="addRecord()">Add Record</button>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Amount</th>
                <th>Type</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="recordList"></tbody>
    </table>

    <footer>
        &copy; Credit Master | Developed by Wani Huzaif
    </footer>
</div>

<script>
    function addRecord() {
        var name = document.getElementById("name").value;
        var amount = document.getElementById("amount").value;
        var type = document.getElementById("type").value;

        if (name === "" || amount === "") {
            alert("Please enter both Name and Amount!");
            return;
        }

        var table = document.getElementById("recordList");
        var row = table.insertRow();

        var cell1 = row.insertCell(0);
        var cell2 = row.insertCell(1);
        var cell3 = row.insertCell(2);
        var cell4 = row.insertCell(3);

        cell1.innerHTML = name;
        cell2.innerHTML = amount;

        if (type === "given") {
            cell3.innerHTML = "<span class='given'>Gave</span>";
        } else {
            cell3.innerHTML = "<span class='taken'>Took</span>";
        }

        cell4.innerHTML = "<button class='delete-btn' onclick='deleteRecord(this)'>X</button>";

        document.getElementById("name").value = "";
        document.getElementById("amount").value = "";
    }

    function deleteRecord(btn) {
        var row = btn.parentNode.parentNode;
        row.parentNode.removeChild(row);
    }
</script>

</body>
</html>
